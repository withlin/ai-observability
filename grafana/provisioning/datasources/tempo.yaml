apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    isDefault: true
    editable: true
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
        queries:
          - name: Inference calls
            query: sum(rate(gen_ai_client_inference_duration_seconds_count{$__tags}[5m]))
